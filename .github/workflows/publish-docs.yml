name: Publish Documentation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout monorepo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install MkDocs dependencies
      run: |
        pip install mkdocs mkdocs-material mkdocs-redirects mkdocs-git-revision-date-localized-plugin

    - name: Build documentation
      working-directory: docs/comfygit-docs
      run: |
        mkdocs build --site-dir ../../build-output
        echo "✓ Documentation built successfully"

    - name: Clone Pages repository
      run: |
        git clone https://${{ secrets.DOCS_PUBLISH_TOKEN }}@github.com/comfygit-ai/comfygit.github.io.git pages-repo
        echo "✓ Pages repository cloned"

    - name: Deploy to /comfygit/ subdirectory
      run: |
        # Configure git for the Pages repo
        cd pages-repo
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Remove old comfygit docs
        rm -rf comfygit/
        echo "✓ Removed old comfygit/ directory"

        # Create comfygit directory and copy new docs
        mkdir -p comfygit/
        cp -r ../build-output/* comfygit/
        echo "✓ Copied new documentation to comfygit/"

        # Ensure CNAME exists at root (for custom domain)
        if [ ! -f CNAME ]; then
          echo "docs.comfygit.org" > CNAME
          echo "✓ Created CNAME file"
        fi

        # Ensure hub index.html exists at root (will be added manually first time)
        if [ ! -f index.html ]; then
          echo "⚠ Warning: index.html not found at root - hub landing page missing"
        fi

    - name: Commit and push changes
      working-directory: pages-repo
      run: |
        git add .

        if git diff --staged --quiet; then
          echo "ℹ No changes to commit"
        else
          git commit -m "Deploy ComfyGit docs from ${{ github.sha }}

          Source: comfygit-ai/comfygit
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}

          🤖 Auto-deployed by GitHub Actions"

          git push
          echo "✓ Changes pushed successfully"
        fi

    - name: Deployment summary
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✅ ComfyGit Documentation Deployed"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📍 Live URL: https://docs.comfygit.org/comfygit/"
        echo "📦 Source: docs/comfygit-docs/"
        echo "🎯 Target: comfygit-ai.github.io/comfygit/"
        echo "📝 Commit: ${{ github.sha }}"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "Allow 1-2 minutes for GitHub Pages to rebuild."
        echo "Visit https://docs.comfygit.org/comfygit/ to view."
