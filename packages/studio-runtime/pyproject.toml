[project]
name = "comfygit-studio"
version = "0.7.0"
description = "ComfyGit Studio runtime - contract API and Studio serving adapters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.3",
    "comfygit-core==0.7.0",
]

[project.urls]
Documentation = "https://docs.comfygit.org/"
Repository = "https://github.com/comfygit-ai/comfygit"
Issues = "https://github.com/comfygit-ai/comfygit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["comfygit_studio"]

[tool.hatch.build.targets.sdist]
include = [
    "comfygit_studio",
    "pyproject.toml",
    "README.md",
]

[tool.uv.sources]
comfygit-core = { workspace = true }
