[project]
name = "comfygit"
version = "0.6.0"
description = "ComfyGit - Git-based environment management for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "comfygit-core==0.6.0",
    "comfygit-studio==0.6.0",
    "argcomplete>=3.5.0",
    "requests>=2.32.4",
]

[project.urls]
Documentation = "https://docs.comfygit.org/"
Repository = "https://github.com/comfygit-ai/comfygit"
Issues = "https://github.com/comfygit-ai/comfygit/issues"

[project.scripts]
comfygit = "comfygit_cli.cli:main"
cg = "comfygit_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["comfygit_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "comfygit_cli",
    "pyproject.toml",
    "README.md",
    "LICENSE.txt",
]

[tool.uv.sources]
comfygit-core = { workspace = true }
comfygit-studio = { workspace = true }
