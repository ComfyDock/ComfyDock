[project]
name = "comfygit-deploy"
version = "0.4.0"
description = "ComfyGit Deploy - Remote deployment and worker management CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "comfygit==0.4.0",
    "aiohttp>=3.13.4",
    "zeroconf>=0.131.0",
]

[project.urls]
Documentation = "https://docs.comfygit.org/"
Repository = "https://github.com/comfygit-ai/comfygit"
Issues = "https://github.com/comfygit-ai/comfygit/issues"

[project.scripts]
cg-deploy = "comfygit_deploy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["comfygit_deploy"]

[tool.uv.sources]
comfygit-core = { workspace = true }
comfygit = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
]
