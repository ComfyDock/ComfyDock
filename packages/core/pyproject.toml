[project]
name = "comfygit-core"
version = "0.6.0"
description = "ComfyGit Core - Git-based ComfyUI environment manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "blake3>=0.3.3",
    "huggingface-hub>=0.15.1",
    "keyring>=25.7.0",
    "packaging>=16.2",
    "requests>=2.32.4",
    "requirements-parser>=0.11.0",
    "tomlkit>=0.11.0",
    "uv>=0.11.8",
    "xxhash>=2.0.0",
]

[project.urls]
Documentation = "https://docs.comfygit.org/"
Repository = "https://github.com/comfygit-ai/comfygit"
Issues = "https://github.com/comfygit-ai/comfygit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# If your source structure requires it, use hatchling's configuration:
[tool.hatch.build.targets.wheel]
packages = ["src/comfygit_core"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
